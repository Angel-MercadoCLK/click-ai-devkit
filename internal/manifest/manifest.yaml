# manifest.yaml — generated by the release pipeline, one per click-ai-devkit release.
# Runtime pins are patched from ENGRAM_VERSION by the release pipeline; Click's binary version
# is injected from the release tag through GoReleaser ldflags, and Scoop metadata describes assets.
# Schema: tech-spec.md §2.3. The marketplace manifest describes retained Claude plugins; this
# release manifest carries qualified tool pins and non-secret release metadata.
schema_version: 1
engram:
  # must match the repo-root ENGRAM_VERSION file (release.yml patches this value from it at
  # release time; internal/manifest/engram_version_sync_test.go guards them matching in between).
  version: "v1.20.0"
  source: "github.com/Gentleman-Programming/engram"
# Must match GENTLE_AI_VERSION. Each pin bump requalifies names and checksums together.
gentle_ai:
  version: "v4.0.0"
  module: "github.com/gentleman-programming/gentle-ai/v4/cmd/gentle-ai"
  assets:
    linux_amd64:
      name: "gentle-ai_4.0.0_linux_amd64.tar.gz"
      sha256: "5f4417cf29c969c86da4799942fd673368840901be1bb09c779a12d7ed6096ea"
    linux_arm64:
      name: "gentle-ai_4.0.0_linux_arm64.tar.gz"
      sha256: "1383b040c95cfc69206660d73c21907b14ad70ab913f410917c54f43d3147e57"
    darwin_amd64:
      name: "gentle-ai_4.0.0_darwin_amd64.tar.gz"
      sha256: "b5b74f22b38ec3339b38e8c68f797dc76ff12ed6580826a6e425d5c718da80c1"
    darwin_arm64:
      name: "gentle-ai_4.0.0_darwin_arm64.tar.gz"
      sha256: "d2159caf6d68f367b18830ece6af71ef26963d5f5320d7df6a794773f45cc7e9"
plugins:
  click-memory:
    version: "0.1.0"
    path: "plugins/click-memory"
  click-review:
    version: "0.1.0"
    path: "plugins/click-review"
  click-skills:
    version: "0.1.0"
    path: "plugins/click-skills"
min_claude_code_version: "1.x"

# Optional Engram Cloud enrollment config. Server URL and project name are non-secret and may be
# shipped in the release manifest; the per-developer token is always supplied via ENGRAM_CLOUD_TOKEN
# at runtime and is never committed (engram-cloud-wiring design).
engram_cloud:
  server: "https://engram.clickseguros.ai"
  project: "clickseguros"
