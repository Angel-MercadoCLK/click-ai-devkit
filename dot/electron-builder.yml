appId: com.click.dot
productName: Click Dot
copyright: Click
asar: true
npmRebuild: false
directories:
  output: release
files:
  - package.json
  - desktop/dist/**/*
  - desktop/assets/**/*
  # Personal-data patterns read by the Electron main process at runtime (screen redaction).
  - lib/guard-patterns.json
  - .next/**/*
  - "!.next/cache/**"
  - "!.next/dev/**"
  - "!**/*.map"
  - "!**/node_modules/.cache/**"
  # The Next.js server never loads SWC at runtime, and native binaries for the Linux build host are useless in a
  # Windows package.
  - "!**/node_modules/@next/swc-*/**"
  - "!**/node_modules/@img/*linux*/**"
  # Production dependencies the packaged app never loads. Everything below is outside the dependency closure of
  # next, react and react-dom (the only packages the Next.js server build and the Electron main process require
  # at runtime; `jose` is bundled into the server chunks, and `ai`, `eve` and `zod` are not imported by the app).
  # test/desktop.test.mjs checks that this list never removes a package the runtime needs.
  - "!**/node_modules/@ai-sdk/**"
  - "!**/node_modules/@oxc-project/**"
  - "!**/node_modules/@rolldown/**"
  - "!**/node_modules/@standard-schema/spec/**"
  - "!**/node_modules/@vercel/oidc/**"
  - "!**/node_modules/@workflow/**"
  - "!**/node_modules/ai/**"
  - "!**/node_modules/consola/**"
  - "!**/node_modules/crossws/**"
  - "!**/node_modules/db0/**"
  - "!**/node_modules/env-runner/**"
  - "!**/node_modules/eve/**"
  - "!**/node_modules/eventsource-parser/**"
  - "!**/node_modules/exsolve/**"
  - "!**/node_modules/h3/**"
  - "!**/node_modules/hookable/**"
  - "!**/node_modules/httpxy/**"
  - "!**/node_modules/jose/**"
  - "!**/node_modules/json-schema/**"
  - "!**/node_modules/nf3/**"
  - "!**/node_modules/nitro/**"
  - "!**/node_modules/ocache/**"
  - "!**/node_modules/pathe/**"
  - "!**/node_modules/rolldown/**"
  - "!**/node_modules/rou3/**"
  - "!**/node_modules/srvx/**"
  - "!**/node_modules/undici/**"
  - "!**/node_modules/unenv/**"
  - "!**/node_modules/unstorage/**"
  - "!**/node_modules/zod/**"
# Fuses are flipped on the packaged exe by electron-builder (via @electron/fuses). Click Dot does not use
# ELECTRON_RUN_AS_NODE (its only child process is PowerShell), NODE_OPTIONS, --inspect or file:// pages.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
win:
  target:
    - target: dir
      arch: x64
  icon: desktop/assets/icon.png
  # Edits the exe resources (icon, ProductName, version) with resedit, which is pure JavaScript and runs on Linux and
  # Windows alike. Code signing is not set up yet, so only that step is skipped.
  signExecutable: false
