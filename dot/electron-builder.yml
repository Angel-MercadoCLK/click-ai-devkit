appId: com.click.dot
productName: Click Dot
copyright: Click
asar: false
npmRebuild: false
directories:
  output: release
files:
  - package.json
  - desktop/dist/**/*
  - desktop/assets/**/*
  # Personal-data patterns read by the Electron main process at runtime (screen redaction).
  - lib/guard-patterns.json
  - .next/**/*
  - "!.next/cache/**"
  - "!.next/dev/**"
  - "!**/*.map"
  - "!**/node_modules/.cache/**"
  # Binaries installed for the Linux build host are useless in a Windows package.
  - "!**/node_modules/@next/swc-linux-*/**"
  - "!**/node_modules/@img/*linux*/**"
  - "!**/node_modules/@rolldown/binding-linux-*/**"
win:
  target:
    - target: dir
      arch: x64
  # rcedit needs wine when packaging from Linux/WSL; the exe therefore has no custom icon or version resources yet (tracked in D5).
  signAndEditExecutable: false
