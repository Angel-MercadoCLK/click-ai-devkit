name: release

on:
  push:
    tags:
      - "v*"

jobs:
  # Click Dot checks (same as CI). The Windows package itself is built in the Windows job below.
  dot-qualification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  windows-release-qualification:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Build Windows package candidate
        shell: pwsh
        run: goreleaser build --snapshot --clean --single-target --skip=validate

      - name: Smoke packaged Windows click.exe
        shell: pwsh
        run: ./scripts/windows-package-smoke.ps1 -DistDir dist -ExpectedVersion 'click version' -DisposableRunner

      # Click Dot is built on Windows so its native dependencies match the platform it runs on, then
      # handed to the goreleaser job as an artifact. The asset name uses the tag without the
      # leading "v" (click-dot_<version>_windows_amd64.zip), matching the click archives.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dot/package-lock.json

      - name: Install Click Dot dependencies
        working-directory: dot
        run: npm ci

      - name: Build Click Dot Windows package
        shell: pwsh
        run: node scripts/package-dot.mjs --version $env:GITHUB_REF_NAME

      - name: Verify Click Dot zip layout
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Get-ChildItem -Path 'dot/release' -Filter 'click-dot_*_windows_amd64.zip' | Select-Object -First 1).FullName
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            if (-not ($zip.Entries.FullName -contains 'Click Dot.exe')) { throw 'Click Dot.exe is not at the zip root' }
          } finally { $zip.Dispose() }

      # Launches the real packaged exe on this disposable runner. GitHub-hosted Windows runners do not
      # enforce Smart App Control, so this proves runtime behavior (DPAPI storage, asar + fuses, Next
      # serving), not what end users with Smart App Control enabled will see (unsigned Dot, accepted A7).
      - name: Smoke packaged Click Dot
        shell: pwsh
        run: |
          $zipPath = (Get-ChildItem -Path 'dot/release' -Filter 'click-dot_*_windows_amd64.zip' | Select-Object -First 1).FullName
          ./scripts/dot-package-smoke.ps1 -ZipPath $zipPath -DisposableRunner

      - name: Upload Click Dot package
        uses: actions/upload-artifact@v4
        with:
          name: click-dot-windows
          path: dot/release/click-dot_*_windows_amd64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  goreleaser:
    runs-on: ubuntu-latest
    needs: [windows-release-qualification, dot-qualification]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare release manifest values
        shell: bash
        run: |
          ENGRAM_VERSION_VALUE="$(tr -d '[:space:]' < ENGRAM_VERSION)"
          export ENGRAM_VERSION_VALUE
          python - <<'PY'
          from pathlib import Path
          import os
          engram = os.environ["ENGRAM_VERSION_VALUE"]
          path = Path("internal/manifest/manifest.yaml")
          lines = path.read_text().splitlines()
          out = []
          in_engram = False
          for line in lines:
              stripped = line.strip()
              if stripped == "engram:":
                  in_engram = True
                  out.append(line)
                  continue
              if in_engram and stripped.startswith("version:"):
                  prefix = line[: line.index("version:")]
                  out.append(f'{prefix}version: "{engram}"')
                  in_engram = False
                  continue
              out.append(line)
          path.write_text("\n".join(out) + "\n")
          PY

      # Brings click-dot_<version>_windows_amd64.zip to dot/release/, where .goreleaser.yaml lists it
      # in checksum.extra_files and release.extra_files. If the artifact is missing or misnamed the
      # release fails before publishing.
      - name: Download Click Dot package
        uses: actions/download-artifact@v4
        with:
          name: click-dot-windows
          path: dot/release

      # v0.1: the scoop manifest is published into THIS repo (bucket/ folder), so the default
      # Actions GITHUB_TOKEN is enough — no SCOOP_BUCKET_TOKEN secret to create or manage.
      # brews publishing is skip_upload=true (deferred fast-follow, D17) so no HOMEBREW_TAP_TOKEN yet.
      #
      # --skip=validate: the "Prepare release manifest values" step above INTENTIONALLY patches
      # internal/manifest/manifest.yaml (engram version from ENGRAM_VERSION) so the built binary
      # embeds the right runtime pin. That patch leaves the tree "dirty", and a plain
      # `goreleaser release` ABORTS on a dirty tree (goreleaser.com/errors/dirty).
      # This is exactly what broke the first v0.2.0 attempt. Skipping `validate` (the git-clean +
      # on-tag checks) is safe here because this job ONLY runs on a `v*` tag push, checks out that
      # exact tag with full history, and the sole modification is our own deterministic manifest
      # patch — so any `git tag vX && git push --tags` now releases cleanly with no manual pre-bump.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
